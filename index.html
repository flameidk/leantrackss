const D=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];const meals={breakfast:{name:'Eggs, oats & berries',cal:455,p:38,ingredients:'2 eggs, 180 g liquid egg whites, 50 g dry oats, 100 g strawberries',steps:'1. Cook oats in water per package.\n2. Scramble eggs and egg whites in a nonstick pan until set.\n3. Serve oats with strawberries.'},yogurt:{name:'Yogurt breakfast bowl',cal:470,p:39,ingredients:'250 g nonfat Greek yogurt, 55 g oats, 100 g berries, 2 boiled eggs',steps:'1. Boil eggs until fully cooked.\n2. Combine yogurt, oats and berries.\n3. Serve eggs on the side.'},potatoegg:{name:'Egg & potato scramble',cal:500,p:40,ingredients:'2 eggs, 180 g egg whites, 250 g potatoes, 5 g olive oil, seasoning',steps:'1. Dice potatoes and cook in measured oil until tender.\n2. Add eggs and egg whites and cook thoroughly.\n3. Season to taste.'},chickenrice:{name:'Chicken rice bowl',cal:600,p:58,ingredients:'225 g raw chicken breast, 180 g cooked rice, 150 g broccoli, 10 g olive oil',steps:'1. Season chicken with paprika, garlic, salt and pepper.\n2. Cook chicken to 165°F internally.\n3. Cook rice and steam broccoli.\n4. Add measured olive oil.'},chickenpotato:{name:'Chicken & potatoes',cal:610,p:58,ingredients:'225 g raw chicken breast, 300 g raw potatoes, 150 g vegetables, 10 g olive oil',steps:'1. Dice potatoes and toss with oil. Roast at 425°F for 25–35 minutes.\n2. Cook chicken to 165°F.\n3. Steam vegetables and serve.'},wrap:{name:'Chicken wrap & potatoes',cal:600,p:55,ingredients:'200 g raw chicken, 1 whole-wheat tortilla, 150 g potatoes, lettuce, 50 g yogurt sauce',steps:'1. Cook seasoned chicken to 165°F.\n2. Roast diced potatoes at 425°F until tender.\n3. Wrap chicken and lettuce in tortilla with yogurt sauce.'},turkeytaco:{name:'Turkey taco bowl',cal:600,p:49,ingredients:'200 g raw 93% lean turkey, 150 g cooked rice, 100 g drained black beans, 60 g salsa, 50 g lettuce',steps:'1. Cook turkey with taco seasoning to 165°F.\n2. Heat beans and rice.\n3. Top with lettuce and salsa.'},pasta:{name:'Turkey pasta',cal:650,p:53,ingredients:'200 g raw lean turkey, 85 g dry pasta, 125 g marinara, 60 g spinach, 5 g olive oil',steps:'1. Cook pasta according to package.\n2. Brown turkey in measured oil to 165°F.\n3. Add sauce and spinach; simmer 5 minutes.\n4. Toss with pasta.'},chili:{name:'Turkey chili & rice',cal:620,p:51,ingredients:'200 g raw lean turkey, 120 g drained beans, 150 g crushed tomatoes, 120 g cooked rice, chili spices',steps:'1. Brown turkey to 165°F.\n2. Add beans, tomatoes and spices. Simmer 15 minutes.\n3. Serve over rice.'},shake:{name:'Strawberry shake & banana',cal:220,p:26,ingredients:'1 scoop strawberry whey isolate, 1 banana, water, ice, optional 5 g creatine',steps:'1. Add protein powder, banana, water and ice to blender.\n2. Blend until smooth.\n3. Add creatine if taking it that day.'},shakenuts:{name:'Strawberry shake & almonds',cal:320,p:29,ingredients:'1 scoop strawberry whey isolate, 1 banana, 20 g almonds, water, ice',steps:'1. Blend whey, banana, water and ice.\n2. Eat almonds alongside.'},shakeapple:{name:'Strawberry shake & apple',cal:210,p:25,ingredients:'1 scoop strawberry whey isolate, 1 apple, water, ice',steps:'1. Mix whey with water and ice.\n2. Eat apple alongside.'},yogurtnut:{name:'Greek yogurt & peanut butter',cal:220,p:19,ingredients:'200 g nonfat Greek yogurt, 15 g peanut butter',steps:'1. Stir peanut butter into yogurt.'},cottage:{name:'Cottage cheese & fruit',cal:250,p:22,ingredients:'200 g low-fat cottage cheese, 100 g berries, 15 g almonds',steps:'1. Top cottage cheese with berries and almonds.'},cottagebread:{name:'Cottage cheese & toast',cal:280,p:23,ingredients:'200 g cottage cheese, 1 slice whole-wheat toast, 15 g peanut butter',steps:'1. Toast bread and spread peanut butter.\n2. Eat with cottage cheese.'}};
const week=[['breakfast','chickenrice','shakenuts','turkeytaco','yogurtnut'],['yogurt','chickenpotato','shakeapple','pasta','cottage'],['potatoegg','chickenrice','shake','turkeytaco','cottage'],['breakfast','wrap','shake','chili','cottagebread'],['breakfast','chickenrice','shakenuts','pasta','yogurtnut'],['potatoegg','chickenpotato','shakeapple','turkeytaco','cottage'],['yogurt','wrap','shake','chili','cottagebread']];
const exercises=[[['Chest press machine','2 × 8–12'],['Incline dumbbell press','2 × 10'],['Triceps pushdown','2 × 12'],['Treadmill','2 miles']],[['Lat pulldown','2 × 10'],['Seated cable row','2 × 10'],['Dumbbell curls','2 × 12'],['Treadmill','2 miles']],[['Leg press','2 × 10'],['Leg curl','2 × 12'],['Calf raises','2 × 15'],['Cable crunch','2 × 12']],[['Easy treadmill','30–40 min'],['Gentle mobility','10 min']],[['Chest press','2 × 10'],['Lat pulldown','2 × 10'],['Shoulder press (only if pain-free)','2 × 10'],['Treadmill','20 min']],[['Goblet squat','2 × 10'],['Romanian deadlift','2 × 10'],['Hanging knee raises','2 × 10'],['Treadmill','20 min']],[['Rest / easy walk','Optional']]];
const groceries=[['Chicken breast','5 lb',20],['93% lean ground turkey','3 lb',16],['Eggs','18 count',4],['Liquid egg whites','32 oz',5],['Nonfat Greek yogurt','3 × 32 oz',12],['Low-fat cottage cheese','2 × 24 oz',7],['White rice','5 lb',4],['Oats','42 oz',4],['Potatoes','5 lb',5],['Pasta','1 lb',2],['Whole-wheat tortillas','1 pack',3],['Whole-wheat bread','1 loaf',3],['Frozen strawberries','2 lb',8],['Bananas','7',2],['Apples','4',3],['Frozen broccoli','2 lb',4],['Frozen mixed vegetables','2 lb',4],['Spinach','1 bag',3],['Lettuce','1 head',2],['Black beans','3 cans',3],['Marinara','1 jar',2],['Salsa','1 jar',2],['Crushed tomatoes','2 cans',3],['Olive oil','1 bottle',6],['Peanut butter','1 jar',3],['Almonds','8 oz',5],['Seasonings','assorted',5]];
let state;try{state=JSON.parse(localStorage.getItem('leantrack-v1'))||{}}catch(e){state={}};state.meals??={};state.workouts??={};state.grocery??={};state.weights??=[{date:new Date().toISOString().slice(0,10),weight:194}];state.food??={};state.prices??={};state.targets??={cal:2200,protein:190,budget:150};state.swaps??={};state.exerciseEdits??={};state.coachLog??=[];let tab='Dashboard',day=(new Date().getDay()+6)%7,recipe=null;const $=x=>document.getElementById(x),save=()=>localStorage.setItem('leantrack-v1',JSON.stringify(state)),dateKey=()=>new Date().toISOString().slice(0,10),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'$'+n.toFixed(2),toast=s=>{let e=$('toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',1700)};
function totals(d=day){let entries=week[d].map((k,i)=>state.swaps[d+':'+i]||k).filter((_,i)=>state.meals[dateKey()+':'+i]);let eaten=entries.reduce((a,k)=>({cal:a.cal+meals[k].cal,p:a.p+meals[k].p}),{cal:0,p:0});let extra=(state.food[dateKey()]||[]).reduce((a,k)=>({cal:a.cal+k.cal,p:a.p+k.p}),{cal:0,p:0});return{cal:eaten.cal+extra.cal,p:eaten.p+extra.p}}
function tabs(){let icons=['◫','◉','▣','▤','↗','✦'];$('tabs').innerHTML=['Dashboard','Meals','Workouts','Groceries','Progress','Coach'].map((x,i)=>`<button class="${tab===x?'active':''}" aria-current="${tab===x?'page':'false'}" onclick="navigate('${x}')"><span>${icons[i]}</span>${x}</button>`).join('')}
function navigate(x){tab=x;recipe=null;render();window.scrollTo({top:0,behavior:'instant'})}function pickDay(i){day=i;recipe=null;render()}function checkMeal(i){let k=dateKey()+':'+i;state.meals[k]=!state.meals[k];save();render()}function checkWorkout(i){let k=dateKey()+':'+day+':'+i;state.workouts[k]=!state.workouts[k];save();render()}function checkGrocery(i){state.grocery[i]=!state.grocery[i];save();render()}function addFood(){let name=$('foodName').value.trim(),cal=Number($('foodCal').value),p=Number($('foodProtein').value);if(!name||!Number.isFinite(cal)||cal<0||!Number.isFinite(p)||p<0)return toast('Enter valid food values');(state.food[dateKey()]??=[]).push({name,cal,p});save();render();toast('Food added')}function addWeight(){let n=Number($('newWeight').value);if(!n||n<50||n>600)return toast('Enter valid weight');state.weights.push({date:dateKey(),weight:n});save();render();toast('Weight saved')}function priceChange(i,v){let n=Number(v);if(n>=0&&Number.isFinite(n)){state.prices[i]=n;save();updateCost()}}function updateCost(){let total=groceries.reduce((a,x,i)=>a+Number(state.prices[i]??x[2]),0);let el=$('cost');if(el)el.textContent=money(total);let rem=$('remaining');if(rem)rem.textContent=money(state.targets.budget-total)}function showRecipe(k){recipe=k;render()}
function ring(value,target,color,label,unit='') {let pct=target>0?Math.max(0,Math.min(100,value/target*100)):0;return `<div class="ring" style="--progress:${pct}%;--ring-color:${color}" role="img" aria-label="${esc(label)}: ${value}${unit} of ${target}${unit}"><div><b>${value}<span>${unit}</span></b><small>/ ${target}${unit}</small></div></div>`}
function weekActivity(){let now=new Date(),today=(now.getDay()+6)%7;return D.map((name,i)=>{let d=new Date(now);d.setDate(d.getDate()-today+i);let key=d.toISOString().slice(0,10),done=exercises[i].filter((_,j)=>state.workouts[key+':'+i+':'+j]).length;return {name,done,total:exercises[i].length,today:i===today,future:i>today}})}
function weightChart(){let points=state.weights.slice(-12);if(points.length<2)return '<div class="chart-empty"><span>↗</span><p>Your progress starts here</p><small>Add another weigh-in to see your trend.</small></div>';let values=points.map(x=>Number(x.weight)),lo=Math.min(...values)-1,hi=Math.max(...values)+1;let coords=values.map((w,i)=>[16+i*288/(values.length-1),94-(w-lo)/(hi-lo)*72]);let line=coords.map(p=>p.join(',')).join(' ');return `<svg class="weight-chart" viewBox="0 0 320 115" role="img" aria-label="Weight trend from ${values[0]} to ${values.at(-1)} pounds across ${values.length} weigh-ins"><defs><linearGradient id="weightFade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#12dcb0" stop-opacity=".25"/><stop offset="1" stop-color="#12dcb0" stop-opacity="0"/></linearGradient></defs><path d="M16 30H304M16 65H304M16 100H304" stroke="#244138" stroke-dasharray="3 5"/><polygon points="16,110 ${line} 304,110" fill="url(#weightFade)"/><polyline points="${line}" fill="none" stroke="#20dfb8" stroke-width="3" stroke-linejoin="round"/>${coords.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3.5" fill="#b6ffdf"/>`).join('')}</svg><div class="row chart-labels"><small>${esc(points[0].date)}</small><small>${esc(points.at(-1).date)}</small></div>`}
function dashboard(){let today=(new Date().getDay()+6)%7,t=totals(today),w=state.weights.at(-1).weight,activity=weekActivity(),done=activity.reduce((a,x)=>a+x.done,0),sessions=activity.filter(x=>x.done>0).length,cart=groceries.reduce((a,x,i)=>a+Number(state.prices[i]??x[2]),0),checked=groceries.filter((_,i)=>state.grocery[i]).length;return `<section class="page dashboard"><div class="dashboard-heading"><div><small class="eyebrow">YOUR DAILY MOMENTUM</small><h2>Let's make progress<span class="accent">.</span></h2><p class="muted">Small steps. Stronger every day.</p></div><span class="date-pill">${new Date().toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span></div>
<div class="week-strip" aria-label="This week's exercise activity">${activity.map(x=>`<div class="week-day ${x.today?'is-today':''}"><small>${x.name.slice(0,1)}</small><span class="day-orbit ${x.done?'has-activity':''}">${x.done?'✓':x.name.slice(0,2)}</span></div>`).join('')}</div>
<div class="dashboard-grid"><article class="card nutrition-card"><div class="row"><h3>Daily nutrition</h3><span class="card-icon">◉</span></div><p class="muted">Fuel for the way you move.</p><div class="nutrition-rings"><div>${ring(t.cal,state.targets.cal,'#12dfb5','Calories','')}<h3>Calories</h3><small>kcal today</small></div><div>${ring(t.p,state.targets.protein,'#c393ff','Protein','g')}<h3>Protein</h3><small>daily protein</small></div></div><div class="nutrition-footer"><span><i></i>${Math.max(0,state.targets.cal-t.cal)} kcal to target</span><button class="text-button" onclick="navigate('Meals')">View meals ↗</button></div></article>
<article class="card training-card"><div class="row"><h3>Training</h3><span class="card-icon">↗</span></div><small>THIS WEEK</small><div class="stat-value">${sessions}<span>/ 7 days</span></div><div class="mini-bars" aria-hidden="true">${activity.map(x=>`<i style="--height:${x.done/x.total*100}%" class="${x.today?'current':''}"><span></span></i>`).join('')}</div><p class="muted">${done} exercises completed</p><button class="text-button" onclick="day=${today};navigate('Workouts')">Log your workout ↗</button></article>
<article class="card weight-card"><div class="row"><h3>Weight progress</h3><span class="card-icon">⌁</span></div><div class="stat-value">${w}<span>lbs</span></div>${weightChart()}<button class="text-button" onclick="navigate('Progress')">Add weigh-in ↗</button></article>
<article class="card activity-card"><div class="row"><div><h3>Weekly activity</h3><small>Completed exercises · this week</small></div><span class="pill">${done} total</span></div><div class="activity-chart" role="img" aria-label="Weekly completed exercises: ${activity.map(x=>x.name+' '+x.done).join(', ')}">${activity.map(x=>`<div class="activity-column ${x.today?'current':''}"><b>${x.done}</b><div class="activity-track"><span style="height:${x.done/x.total*100}%"></span></div><small>${x.name.slice(0,3)}</small></div>`).join('')}</div><p class="chart-note">${done?'Every logged exercise is a little more momentum.':'Your next workout starts the chart. Log an exercise to begin.'}</p></article>
<article class="card budget-card"><div class="row"><h3>Grocery budget</h3><span class="card-icon">▤</span></div><div class="stat-value">${money(cart)}<span>/ ${money(state.targets.budget)}</span></div><div class="bar"><div class="fill" style="width:${state.targets.budget>0?Math.min(100,cart/state.targets.budget*100):100}%"></div></div><p class="muted">${cart>state.targets.budget?money(cart-state.targets.budget)+' over budget':money(state.targets.budget-cart)+' left in your budget'} · estimated</p><div class="row"><small>${checked}/${groceries.length} items checked</small><button class="text-button" onclick="navigate('Groceries')">Open list ↗</button></div></article>
<article class="card focus-card"><div><small class="eyebrow">TODAY'S FOCUS · ${D[today].toUpperCase()}</small><h3>${['Chest + triceps','Back + biceps','Legs + abs','Active recovery','Upper body','Legs + abs','Rest & recharge'][today]}</h3><p class="muted">Show up for yourself, one session at a time.</p></div><button onclick="day=${today};navigate('Workouts')">Let's go <span aria-hidden="true">↗</span></button></article></div>
<div class="card"><h2>Log extra food</h2><label>Food name</label><input id="foodName" placeholder="e.g. grilled chicken"><div class="two"><div><label>Calories</label><input id="foodCal" type="number" placeholder="200"></div><div><label>Protein (g)</label><input id="foodProtein" type="number" placeholder="30"></div></div><p><button onclick="addFood()">Add food</button></p>${(state.food[dateKey()]||[]).map((x,i)=>`<div class="row item"><div>${esc(x.name)}<br><small>${x.cal} cal · ${x.p}g protein</small></div><button class="secondary small" onclick="state.food[dateKey()].splice(${i},1);save();render()">Remove</button></div>`).join('')}</div><p class="data-note">Nutrition values are estimates. Your plans and entries stay on this device.</p></section>`}

function dayPicker(){return '<div class="chips day-picker" aria-label="Choose plan day">'+D.map((d,i)=>'<button aria-pressed="'+(day===i)+'" class="'+(day===i?'active':'')+'" onclick="pickDay('+i+')">'+d.slice(0,3)+'</button>').join('')+'</div>'}
function sessionSummary(kind){let workout=kind==='workout',count=workout?exercises[day].length:week[day].length,completed=Array.from({length:count},(_,i)=>workout?state.workouts[dateKey()+':'+day+':'+i]:state.meals[dateKey()+':'+i]).filter(Boolean).length;return '<div class="card session-summary"><div class="row"><div><small class="eyebrow">'+D[day].toUpperCase()+' · '+(workout?'TRAINING':'MEAL PLAN')+'</small><h3>'+ (completed===count?(workout?'Session complete. Well done!':'Meals logged. Nice work!'):(workout?'One exercise at a time.':'Make every meal count.'))+'</h3></div><span class="completion-score">'+completed+'<small>/'+count+'</small></span></div><div class="bar"><div class="fill" style="width:'+completed/count*100+'%"></div></div><div class="row"><small aria-live="polite">'+completed+' of '+count+' '+(workout?'exercises completed':'meals logged today')+'</small>'+(workout&&completed<count?'<button class="text-button" onclick="nextExercise()">Next exercise ↓</button>':'')+'</div></div>'}
function nextExercise(){let i=exercises[day].findIndex((_,i)=>!state.workouts[dateKey()+':'+day+':'+i]);let row=document.querySelectorAll('.exercise-row')[i];if(row){row.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'center'});row.querySelector('.check').focus({preventScroll:true})}}
function openPhoto(button){let img=button.querySelector('img'),dialog=$('photoViewer');$('photoPreview').src=img.src;$('photoPreview').alt=img.alt;$('photoCaption').textContent=img.alt;dialog.showModal()}
function mealPage(){return `<section class="page"><h2>7-day meal planner</h2><p class="photo-credit">Serving inspiration · Photos via <a href="https://www.pexels.com/" target="_blank" rel="noopener">Pexels</a></p>${dayPicker()}${!recipe?sessionSummary('meal'):''}${recipe?`<div class="card"><button class="secondary small" onclick="recipe=null;render()">← Back to meals</button><div class="recipe-visual">${mealVisual(recipe)}</div><h2 style="margin-top:15px">${esc(meals[recipe].name)}</h2><span class="pill">~${meals[recipe].cal} cal · ~${meals[recipe].p}g protein</span><h3 style="margin-top:20px">Ingredients</h3><p class="recipe">${esc(meals[recipe].ingredients)}</p><h3>Instructions</h3><p class="recipe">${esc(meals[recipe].steps)}</p></div>`:week[day].map((original,i)=>{let k=state.swaps[day+':'+i]||original;return `<div class="card meal-card"><div class="meal-visual">${mealVisual(k)}</div><div class="meal-details"><div class="row"><div><small>${['Breakfast','Lunch','Snack','Dinner','Evening'][i]}</small><h3>${esc(meals[k].name)}</h3><small>${meals[k].cal} cal · ${meals[k].p}g protein</small></div><input aria-label="Mark meal eaten" class="check" style="width:24px" type="checkbox" ${state.meals[dateKey()+':'+i]?'checked':''} onchange="checkMeal(${i})"></div><p><button class="secondary small" onclick="showRecipe('${k}')">View recipe ↗</button></p></div></div>`}).join('')}<div class="card"><small>Planned menu total</small><div class="big">${week[day].reduce((s,k,i)=>s+meals[state.swaps[day+':'+i]||k].cal,0)} cal</div><p class="muted">${week[day].reduce((s,k,i)=>s+meals[state.swaps[day+':'+i]||k].p,0)} g protein • Estimates may vary by brand and portions.</p></div></section>`}
function workoutPage(){return `<section class="page"><h2>Weekly training</h2><p class="photo-credit">Workout photography via <a href="https://www.pexels.com/" target="_blank" rel="noopener">Pexels</a></p>${dayPicker()}${sessionSummary('workout')}<div class="card workout-session"><h2>${D[day]}</h2><p class="muted">Start with manageable weights and only train sore muscles when movement is comfortable.</p>${exercises[day].map((original,i)=>{let x=state.exerciseEdits[day+':'+i]||original;return `<div class="row item exercise-row"><div class="exercise-visual">${workoutVisual(x[0])}</div><div class="exercise-copy ${state.workouts[dateKey()+':'+day+':'+i]?'done':''}"><b>${esc(x[0])}</b><br><small>${esc(x[1])}</small></div><input aria-label="Mark exercise done" class="check" type="checkbox" ${state.workouts[dateKey()+':'+day+':'+i]?'checked':''} onchange="checkWorkout(${i})"></div>`}).join('')}</div><div class="card"><h3>Training guidance</h3><p class="muted">Warm up 5–10 minutes. Keep 2–3 repetitions in reserve, increase gradually, and prioritize recovery. Treadmill walking is fine at a comfortable pace.</p></div></section>`}
function groceryPage(){let total=groceries.reduce((a,x,i)=>a+Number(state.prices[i]??x[2]),0);return `<section class="page"><h2>Weekly grocery list</h2><div class="card hero"><small>ESTIMATED CART TOTAL</small><div class="big" id="cost">${money(total)}</div><div>Remaining of $${state.targets.budget}: <b id="remaining">${money(state.targets.budget-total)}</b></div><small>Prices are editable estimates, not live store quotes. Supplements excluded. Some quantities may need adjustment to cover every listed portion.</small></div>${groceries.map((x,i)=>`<div class="card" style="margin:7px 0;padding:12px"><div class="row"><div style="flex:1"><label style="margin:0"><input type="checkbox" class="check" ${state.grocery[i]?'checked':''} onchange="checkGrocery(${i})"> <span class="${state.grocery[i]?'done':''}">${esc(x[0])}</span></label><small>${esc(x[1])}</small></div><div style="width:75px"><input aria-label="Price for ${esc(x[0])}" type="number" min="0" step="0.01" value="${state.prices[i]??x[2]}" onchange="priceChange(${i},this.value)"></div></div></div>`).join('')}<button class="secondary" onclick="if(confirm('Reset grocery checkmarks?')){state.grocery={};save();render()}">Reset grocery checks</button></section>`}
function progressPage(){let weights=[...state.weights].reverse();return `<section class="page"><h2>Weight progress</h2><div class="card hero"><small>LATEST WEIGHT</small><div class="big">${weights[0].weight} lbs</div><small>Starting weight: 194 lbs • Visible abs depend on body composition, not just weight.</small></div><div class="card progress-trend"><h3>Your recent trend</h3>${weightChart()}</div><div class="card"><h3>Add weigh-in</h3><label>Weight in pounds</label><input type="number" id="newWeight" step="0.1" placeholder="e.g. 192.5"><p><button onclick="addWeight()">Save weigh-in</button></p></div><div class="card"><h3>History</h3>${weights.map((w,i)=>`<div class="row item"><span>${esc(w.date)}</span><b>${w.weight} lbs</b></div>`).join('')}</div><div class="card"><h3>Your approach</h3><p class="muted">Aim for approximately 0.5–1.5 lb loss per week. Compare weekly average weights, maintain resistance training, and adjust calories only after 2–3 weeks of consistent tracking.</p><button class="secondary small" onclick="if(confirm('Erase all app data on this device?')){localStorage.removeItem('leantrack-v1');location.reload()}">Reset all data</button></div></section>`}
function coachPage(){let logs=state.coachLog.slice(-12);return `<section class="page"><div class="card hero"><small>YOUR PLAN ASSISTANT</small><h2>✦ LeanTrack Coach</h2><p class="muted">Edit your meal plan, workouts and targets. This is an offline plan editor, not a live ChatGPT connection. Changes are saved on this device.</p></div><div class="card"><h3>Daily targets</h3><div class="two"><div><label>Calories</label><input id="targetCal" type="number" value="${state.targets.cal}"></div><div><label>Protein (g)</label><input id="targetProtein" type="number" value="${state.targets.protein}"></div></div><label>Weekly grocery budget ($)</label><input id="targetBudget" type="number" value="${state.targets.budget}"><p><button onclick="saveTargets()">Save targets</button></p></div><div class="card"><h3>Swap a meal</h3><label>Day</label><select id="swapDay">${D.map((x,i)=>`<option value="${i}" ${day===i?'selected':''}>${x}</option>`).join('')}</select><label>Meal</label><select id="swapSlot">${['Breakfast','Lunch','Snack','Dinner','Evening'].map((x,i)=>`<option value="${i}">${x}</option>`).join('')}</select><label>Replacement recipe</label><select id="swapRecipe">${Object.entries(meals).map(([k,v])=>`<option value="${k}">${esc(v.name)} (${v.cal} cal, ${v.p}g)</option>`).join('')}</select><p><button onclick="swapMeal()">Apply meal change</button></p><small>Grocery quantities do not automatically recalculate after swaps.</small></div><div class="card"><h3>Change a workout exercise</h3><label>Day</label><select id="exerciseDay" onchange="updateExerciseOptions()">${D.map((x,i)=>`<option value="${i}" ${day===i?'selected':''}>${x}</option>`).join('')}</select><label>Exercise to replace</label><select id="exerciseSlot"></select><label>New exercise name</label><input id="exerciseName" placeholder="e.g. Dumbbell bench press"><label>Sets and reps</label><input id="exerciseReps" placeholder="e.g. 2 × 10"><p><button onclick="editExercise()">Save exercise</button></p></div><div class="card"><h3>Ask about changing your plan</h3><p class="muted">For personalized AI advice, copy your question and open ChatGPT. Changes you decide on can be applied using the editors above.</p><textarea id="coachQuestion" rows="3" placeholder="e.g. Can you make Tuesday lower carb?"></textarea><p><button onclick="askChatGPT()">Copy question & open ChatGPT ↗</button></p></div><div class="card"><h3>Recent changes</h3>${logs.length?logs.slice().reverse().map(x=>`<p class="muted">${esc(x)}</p>`).join(''):'<p class="muted">No changes yet.</p>'}</div></section>`}
function logCoach(x){state.coachLog.push(x);save();toast('Plan updated');render()}
function saveTargets(){let cal=Number($('targetCal').value),protein=Number($('targetProtein').value),budget=Number($('targetBudget').value);if(cal<1200||cal>5000||protein<40||protein>350||budget<0||budget>10000)return toast('Check target values');state.targets={cal,protein,budget};logCoach('Targets updated: '+cal+' calories, '+protein+'g protein, $'+budget+' budget')}
function swapMeal(){let d=Number($('swapDay').value),slot=Number($('swapSlot').value),k=$('swapRecipe').value;state.swaps[d+':'+slot]=k;logCoach(D[d]+' '+['breakfast','lunch','snack','dinner','evening'][slot]+' changed to '+meals[k].name)}
function updateExerciseOptions(){let d=Number($('exerciseDay').value),el=$('exerciseSlot');if(el)el.innerHTML=exercises[d].map((x,i)=>`<option value="${i}">${esc((state.exerciseEdits[d+':'+i]||x)[0])}</option>`).join('')}
function editExercise(){let d=Number($('exerciseDay').value),i=Number($('exerciseSlot').value),name=$('exerciseName').value.trim(),reps=$('exerciseReps').value.trim();if(!name||!reps||name.length>100||reps.length>60)return toast('Enter exercise and sets/reps');state.exerciseEdits[d+':'+i]=[name,reps];logCoach(D[d]+' exercise changed to '+name+' — '+reps)}
function askChatGPT(){let q=$('coachQuestion').value.trim();if(!q)return toast('Enter your question');let context='I am 23, male, 5ft10, 194 lb, aiming to lose fat while keeping muscle. My current targets are '+state.targets.cal+' kcal and '+state.targets.protein+'g protein daily, grocery budget $'+state.targets.budget+'/week. Please advise: '+q;try{navigator.clipboard.writeText(context).then(()=>toast('Question copied; paste into ChatGPT')).catch(()=>toast('Open ChatGPT and paste your question'))}catch(e){}window.open('https://chatgpt.com/','_blank')}

function render(){tabs();$('main').innerHTML=({Dashboard:dashboard,Meals:mealPage,Workouts:workoutPage,Groceries:groceryPage,Progress:progressPage,Coach:coachPage})[tab]();if(tab==='Coach')updateExerciseOptions();document.querySelectorAll('label').forEach(label=>{let el=label.nextElementSibling;if(el&&el.id&&/INPUT|SELECT|TEXTAREA/.test(el.tagName))label.htmlFor=el.id})}render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
